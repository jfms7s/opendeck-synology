# Pushing a version tag (vX.Y.Z, matching Cargo.toml and manifest.json)
# checks, builds (Linux binaries on Ubuntu, the macOS one on a macOS
# runner) and creates a *draft* release with the bundle and its SHA256SUMS
# attached, after attesting the bundle's build provenance (verify with
# `gh attestation verify`). The draft's notes are the README's smoke-test checklist, unticked
# (scripts/release-body.mjs). Publish it by hand only after running that
# checklist on a device and linking the release's smoke log in the notes: a
# release is never visible without its asset.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The one place the toolchain is pinned in this file (ci.yml has its own copy).
env:
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node build.mjs --check-version --tag "$GITHUB_REF_NAME"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build-macos:
    needs: verify
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Check it is a signed arm64 binary that starts
        run: scripts/check-binary.sh aarch64-apple-darwin target/aarch64-apple-darwin/release/opendeck-synology
      - name: Pack the binary (a tar keeps the executable bit; artifacts don't)
        run: tar -cf macos-bin.tar -C target/aarch64-apple-darwin/release opendeck-synology
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-bin
          path: macos-bin.tar
          if-no-files-found: error

  build:
    needs: [verify, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - name: Install the aarch64 linker and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - name: Start each binary once
        run: |
          scripts/check-binary.sh x86_64-unknown-linux-gnu target/x86_64-unknown-linux-gnu/release/opendeck-synology
          scripts/check-binary.sh aarch64-unknown-linux-gnu target/aarch64-unknown-linux-gnu/release/opendeck-synology
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bin
      - name: Unpack the macOS binary where build.mjs looks for it
        run: |
          mkdir -p target/aarch64-apple-darwin/release
          tar -xf macos-bin.tar -C target/aarch64-apple-darwin/release
          # On Linux only the format can be checked (signature and start: build-macos).
          scripts/check-binary.sh aarch64-apple-darwin target/aarch64-apple-darwin/release/opendeck-synology
      - run: node build.mjs --release --tag "$GITHUB_REF_NAME"
      - name: Check the bundle holds an executable macOS binary
        run: unzip -Z dist/opendeck-synology.streamDeckPlugin | grep -E '^-rwx.*opendeck-synology-aarch64-apple-darwin$'
      # Written after build.mjs (which empties dist/), so it is in neither the
      # bundle nor SHA256SUMS; it only becomes the draft's notes.
      - name: Write the draft's notes (the README smoke checklist, unticked)
        run: node scripts/release-body.mjs > dist/RELEASE_BODY.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: |
            dist/opendeck-synology.streamDeckPlugin
            dist/SHA256SUMS
            dist/RELEASE_BODY.md
          if-no-files-found: error

  # The only job that can write to the repository, and it runs no build:
  # it checks, attests and attaches what `build` produced.
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
          path: dist
      - name: Check the bundle against SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/opendeck-synology.streamDeckPlugin
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body_path: dist/RELEASE_BODY.md
          fail_on_unmatched_files: true
          files: |
            dist/opendeck-synology.streamDeckPlugin
            dist/SHA256SUMS
