name: Release
# Replaces the in-repo release jobs verify, build-macos, build, release.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    # The called workflow's own jobs ask for exactly what they need; only its
    # `publish` job gets the write permissions.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: jfms7s/opendeck-plugin-ci/.github/workflows/release.yml@b9bf0819298f7b391f25e7dec1a959f8390e7ae0 # v0.1.1
    with:
      audit: "cargo-deny"
      check-macos: "scripts/check-binary.sh aarch64-apple-darwin {bin}"
      aarch64-linux: true
      check-x86_64: "scripts/check-binary.sh x86_64-unknown-linux-gnu {bin}"
      check-aarch64: "scripts/check-binary.sh aarch64-unknown-linux-gnu {bin}"
      release-notes: true
