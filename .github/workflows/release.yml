name: Release
on:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - name: Install cross-compilation linker (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target x86_64-unknown-linux-gnu
      - run: cargo build --release --target aarch64-unknown-linux-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs x86_64-unknown-linux-gnu
      - name: Assemble a universal bundle (both architectures, one manifest)
        run: |
          cp target/aarch64-unknown-linux-gnu/release/opendeck-synology \
             dist/com.jfms7s.synology.sdPlugin/opendeck-synology-aarch64-unknown-linux-gnu
      - name: Zip the plugin bundle
        run: |
          cd dist
          zip -r ../opendeck-synology.streamDeckPlugin com.jfms7s.synology.sdPlugin
      - uses: softprops/action-gh-release@v2
        with:
          files: opendeck-synology.streamDeckPlugin
