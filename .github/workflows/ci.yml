name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node build.mjs --check-version

  # The oldest Rust that Cargo.toml's `rust-version` promises, on both
  # platforms a release ships (macOS adds its own keyring dependencies).
  msrv:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.88.0
      - run: cargo check --all-targets --locked

  # The release ships an aarch64 binary too: build it (and start it once,
  # under emulation) on every change, not only when a release is cut.
  aarch64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.98.1
          targets: aarch64-unknown-linux-gnu
      - name: Install the aarch64 linker and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - run: qemu-aarch64 -L /usr/aarch64-linux-gnu target/aarch64-unknown-linux-gnu/release/opendeck-synology --version

  # The release ships an Apple Silicon binary: lint, test and package it
  # natively, and check the Keychain really stores secrets (keyring falls
  # back to a mock store without its macOS backend). fmt and cargo-deny
  # don't depend on the platform.
  macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.98.1
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Round-trip a secret through the real Keychain
        timeout-minutes: 5
        run: cargo test --locked keyring_round_trip -- --ignored
      - run: cargo build --release --locked
      # The release's build-macos checks, here so a PR catches them before a tag.
      - name: Check it is a signed arm64 binary that starts
        run: |
          bin=target/release/opendeck-synology
          file "$bin"
          file -b "$bin" | grep -Eq '^Mach-O 64-bit (arm64 executable|executable arm64)'
          codesign --verify --verbose "$bin"
          "$bin" --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node build.mjs

  advisories:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
