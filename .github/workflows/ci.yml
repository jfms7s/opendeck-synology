name: CI
on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so a RustSec advisory against a dependency surfaces in a quiet
  # week too (`advisories`); the other jobs run along with it.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# The one place each toolchain is pinned in this file (release.yml has its
# own copy). RUST_MSRV must match Cargo.toml's `rust-version`.
env:
  RUST_TOOLCHAIN: "1.98.1"
  RUST_MSRV: "1.88.0"

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1
      # Replaces `cargo test`: the same tests, instrumented. The fragment waits in
      # RUNNER_TEMP until every test in the job has passed (see the collect step).
      - name: Test with coverage (eng-metrics-lab)
        run: cargo llvm-cov --locked --lcov --output-path "$RUNNER_TEMP/coverage-rust.lcov"
      # keyring silently falls back to an in-memory mock store when the OS
      # backend is missing; fail if the Secret Service backend leaves the graph.
      # (`cargo tree -i` only warns and exits 0 when nothing matches, hence grep.)
      - name: Linux keyring backend is linked
        run: cargo tree --locked -e normal --target x86_64-unknown-linux-gnu -i secret-service --depth 0 | grep -q '^secret-service '
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node build.mjs --check-version
      # The Release workflow builds the draft's notes from the README's smoke
      # checklist markers; catch a broken marker here, not on a pushed tag.
      - run: node scripts/release-body.mjs > /dev/null
      # The binary checks CI and the Release share (shellcheck ships with the runner).
      - run: shellcheck scripts/check-binary.sh
      # Only reached when every step above passed, so a red test leaves no fragment.
      - name: Collect coverage fragment (eng-metrics-lab)
        run: |
          mkdir -p .quality
          mv "$RUNNER_TEMP/coverage-rust.lcov" .quality/coverage-rust.lcov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-fragments
          path: .quality/coverage-rust.lcov
          include-hidden-files: true
          retention-days: 7

  # The oldest Rust that Cargo.toml's `rust-version` promises, on Linux and
  # macOS. One job, two legs: the explicit `name:` keeps the check names the
  # "Protect master" ruleset requires (`msrv`, `msrv-macos`); a matrix with the
  # default name would report `msrv (ubuntu-24.04)` and block every PR.
  msrv:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: msrv
            os: ubuntu-24.04
          - check: msrv-macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_MSRV }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-targets --locked

  # The release ships an aarch64 binary too: build it (and start it once,
  # under emulation) on every change, not only when a release is cut.
  aarch64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the aarch64 linker and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - run: scripts/check-binary.sh aarch64-unknown-linux-gnu target/aarch64-unknown-linux-gnu/release/opendeck-synology

  # The release ships an Apple Silicon binary: lint, test and package it
  # natively, and check the Keychain really stores secrets (keyring falls
  # back to a mock store without its macOS backend). fmt and cargo-deny
  # don't depend on the platform.
  macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Round-trip a secret through the real Keychain
        timeout-minutes: 5
        run: cargo test --locked keyring_round_trip -- --ignored
      - run: cargo build --release --locked
      # The release's build-macos checks, here so a PR catches them before a tag.
      - name: Check it is a signed arm64 binary that starts
        run: scripts/check-binary.sh aarch64-apple-darwin target/release/opendeck-synology
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node build.mjs

  advisories:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # eng-metrics-lab (report-only): duplication, complexity and dead code; the collector picks up the artifact.
  quality:
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-fragments
          path: .quality
        continue-on-error: true
      - name: Code quality (report-only)
        uses: jfms7s/eng-metrics-lab/action@v0
        continue-on-error: true
