# cargo-deny configuration. CI runs `cargo deny check advisories` only.
[advisories]
ignore = [
    # zvariant, zbus_names and zvariant_derive were folded into zbus 6.0 and are no longer
    # maintained as separate crates. They are notices, not vulnerabilities, and zbus 5.x has no
    # release without them. Remove these when the plugin moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; zbus 5 depends on it" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; zbus 5 depends on it" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; zbus 5 depends on it" },
]
